<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- o painel só tem tema claro: impede o "modo escuro automático" do navegador de escurecer as cores -->
  <meta name="color-scheme" content="only light">
  <title>Bosses · Tibia Collection</title>
  <script>
    // Se as imagens do tema (tema/) não estiverem presentes, usa cores no lugar.
    (function () {
      // só desliga o tema se a imagem falhar 3 vezes (uma falha passageira do servidor não derruba o visual)
      var tentativas = 0, raiz = document.documentElement;
      function testar() {
        var i = new Image();
        i.onload = function () { raiz.classList.remove("sem-tema"); };
        i.onerror = function () {
          if (++tentativas < 3) setTimeout(testar, 1500);
          else raiz.classList.add("sem-tema");
        };
        i.src = "tema/border-1.gif" + (tentativas ? "?r=" + tentativas : "");
      }
      testar();
    })();
  </script>
  <!-- "?v=" com a hora atual: o navegador sempre carrega a versão mais nova dos arquivos -->
  <script>document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');</script>
</head>
<body data-pagina="bosses">
  <div class="arte" aria-hidden="true"></div>

  <div id="Pagina">
    <!-- coluna do menu (como no tibia.com) -->
    <div id="MenuColumn">
      <div id="LeftArtwork">
        <a href="index.html" id="LogoLink" title="Tibia Collection"><img id="TibiaLogoArtworkTop" src="tema/logo-collection.png" alt="Tibia Collection"></a>
      </div>

      <div class="SmallMenuBox" id="BuscaBox">
        <div class="SmallBoxTop"></div>
        <div class="SmallBoxBorder BorderLeft"></div>
        <div class="SmallBoxBorder BorderRight"></div>
        <div class="SmallBoxButtonContainer">
          <label for="busca">Buscar boss</label>
          <input id="busca" type="search" placeholder="Nome ou local..." autocomplete="off">
        </div>
        <div class="SmallBoxBottom"></div>
      </div>

      <div id="Menu">
        <div id="MenuTop"></div>
        <div id="MenuItens"></div>
        <div id="MenuBottom"></div>
      </div>
    </div>

    <!-- conteúdo -->
    <div id="ContentColumn" class="Content">
      <div id="secoes"></div>
      <p id="vazio" class="vazio" hidden>Nenhum boss encontrado.</p>
      <div id="Footer">Tibia Collection: fã-site sem vínculo com a CipSoft. Dados: TibiaWiki BR. Visual baseado em tibia.com (CipSoft GmbH).<br>
        Atualize os dados com <code>python coletar.py</code>.</div>
    </div>
  </div>

  <script>
    var v = Date.now();
    document.write('<script src="bosses.js?v=' + v + '"><\/script>');
    document.write('<script src="bosses-extra.js?v=' + v + '"><\/script>');
    document.write('<script src="app.js?v=' + v + '"><\/script>');
    document.write('<script src="menu.js?v=' + v + '"><\/script>');
  </script>
</body>
</html>
